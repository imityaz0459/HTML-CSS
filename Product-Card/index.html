<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card component</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="left-content">
    <picture>
        <source
            media="(max-width:520px)"
            srcset="image-product-mobile.jpg">

        <img
            src="image-product-desktop.jpg"
            alt="product-image"
            class="product-image">
    </picture>
</div>
            <div class="right-content">
                <p class="product-name">PERFUME</p>
                <div class="product-info">
                    <h1 class="product-heading">Gabrielle</h1>
                    <h1 class="product-heading">Essence Eau</h1>
                    <h1 class="product-heading">De Parfum</h1>

                    <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the house of CHANEL.</p>
                </div>
                <div class="product-price">
                    <h1 class="new-price">$149.99</h1>
                    <p class="old-price">$169.99</p>
                </div>
              <button class="cart-btn">
    <svg width="15" height="16" viewBox="0 0 15 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M14.383 10.054H4.229L3.27 4.558H15L14.383 10.054ZM3.036 3.562L2.673 1.5H.75V0H3.538L3.918 2.062H16.5L15.555 10.554H4.08L4.443 12.616H14.25V14.116H3.548L2.18 3.562H3.036ZM6 16C5.172 16 4.5 15.328 4.5 14.5C4.5 13.672 5.172 13 6 13C6.828 13 7.5 13.672 7.5 14.5C7.5 15.328 6.828 16 6 16ZM13 16C12.172 16 11.5 15.328 11.5 14.5C11.5 13.672 12.172 13 13 13C13.828 13 14.5 13.672 14.5 14.5C14.5 15.328 13.828 16 13 16Z"
            fill="white" />
    </svg>

    Add to Cart
</button>
            </div>
        </div>
    </div>
</body>
</html>
