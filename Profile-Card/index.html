<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-top">
                <img src="image-victor.jpg" alt="profile-image" class="profile-image">
            </div>
            <div class="card-content">
                <p class="card-name">Victor Crest       <span class="card-age">  26</span></p>
                <P class="card-address">Londan</P>
                <div class="card-status">
                    <div class="card-stat">
                        <strong>80K</strong>
                        <SPAN>Followers</SPAN>
                    </div>

                     <div class="card-stat">
                        <strong>803K</strong>
                        <SPAN>Likes</SPAN>
                    </div>

                     <div class="card-stat">
                        <strong>1.4K</strong>
                        <SPAN>Photos</SPAN>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
